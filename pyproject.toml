[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-agent"
version = "0.1.0"
description = "Enterprise AI Banking Agent with LangGraph, FastAPI, and Deterministic Gateways"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.2.20",
    "langchain-core>=0.2.20",
    "langchain-groq>=0.1.6",
    "langgraph-checkpoint-postgres>=3.1.2",
    "groq>=0.9.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.4",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0",
    "guardrails-ai>=0.11.0",
    "reportlab>=4.0.0",
    "lxml>=5.0.0",
    "langsmith>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "apps.api.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "apps*", "checkpoints*", "database*", "gateway*", "policies*", "security*", "services*", "tools*"]
exclude = ["tests*", "docker*", "docs*"]

[tool.setuptools.package-data]
"*" = ["*"]



